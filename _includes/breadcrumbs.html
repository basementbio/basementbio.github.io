<nav class="breadcrumbs" aria-label="Breadcrumb">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Home</a></li>
    {% if page.collection %}
      {% if page.collection == "experiments" %}
        <li><a href="{{ '/experiments/' | relative_url }}">Experiments</a></li>
      {% elsif page.collection == "products" %}
        <li><a href="{{ '/products/' | relative_url }}">Products</a></li>
      {% endif %}
      <li aria-current="page">{{ page.title }}</li>
    {% elsif page.url != "/" and page.title %}
      <li aria-current="page">{{ page.title }}</li>
    {% endif %}
  </ol>
</nav>
